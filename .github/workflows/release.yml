name: Release

# Trigger: push a tag like `v1.0.0` and this builds binaries + creates a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: macos-arm64
          - os: ubuntu-latest   # x86_64
            target: linux-x86_64
          - os: ubuntu-24.04-arm  # ARM64
            target: linux-arm64
        # Note: Intel macOS (macos-13) was dropped because GitHub's Intel runner
        # pool is severely backed up (jobs queue for 10+ hours). Apple Silicon and
        # Linux cover virtually all users. To add Intel back later, append:
        #   - os: macos-13
        #     target: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp build/uwu dist/uwu
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf uwu-${{ matrix.target }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: uwu-${{ matrix.target }}
          path: uwu-${{ matrix.target }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "uwu $GITHUB_REF_NAME" \
            --generate-notes
